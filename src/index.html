<!DOCTYPE html>
<html>
<head>
    <title>Physis Ontological Map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; margin: 0; display: flex; height: 100vh; }
        #cy { flex: 2; border-right: 1px solid #0f0; }
        #sidebar { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #transcript { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; border-bottom: 1px solid #0f0; }
        #stats { padding: 10px; height: 50px; }
        h3 { margin: 0 0 10px 0; border-bottom: 1px solid #0f0; }
    </style>
</head>
<body>
    <div id="cy"></div>
    <div id="sidebar">
        <div id="transcript">
            <h3>Transcript</h3>
            <div id="transcript-content"></div>
        </div>
        <div id="stats">
            Entities: <span id="count">0</span>
        </div>
    </div>

    <script>
        var cy = cytoscape({
            container: document.getElementById('cy'),
            style: [
                {
                    selector: 'node',
                    style: {
                        'background-color': '#0f0',
                        'label': 'data(name)',
                        'color': '#0f0',
                        'font-family': 'monospace',
                        'font-size': '10px',
                        'width': '10px',
                        'height': '10px'
                    }
                },
                {
                    selector: 'edge',
                    style: {
                        'width': 1,
                        'line-color': '#050',
                        'target-arrow-color': '#050',
                        'target-arrow-shape': 'triangle',
                        'curve-style': 'bezier',
                        'label': 'data(predicate)',
                        'font-size': '8px',
                        'color': '#0a0',
                        'text-rotation': 'autorotate'
                    }
                }
            ],
            layout: { name: 'cose' }
        });

        async function update() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                // Update Transcript
                const content = document.getElementById('transcript-content');
                content.innerHTML = data.transcripts.map(t => `<p>> ${t}</p>`).join('');
                content.scrollTop = content.scrollHeight;

                document.getElementById('count').innerText = Object.keys(data.map.entities).length;

                // Update Graph
                const elements = [];
                for (const id in data.map.entities) {
                    elements.push({ data: { id: id, name: data.map.entities[id].name } });
                }
                data.map.relationships.forEach((rel, i) => {
                    elements.push({ data: { id: 'e'+i, source: rel.source, target: rel.target, predicate: rel.predicate } });
                });

                cy.json({ elements: elements });
                cy.layout({ name: 'cose', animate: false }).run();

            } catch (e) { console.error(e); }
        }

        setInterval(update, 2000);
        update();
    </script>
</body>
</html>
